<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>PhotoBooth</title>
    <base href="/" />
    <link href="css/bootstrap/bootstrap.min.css" rel="stylesheet" />
    <link href="css/app.css" rel="stylesheet" />
    <link href="PhotoBooth.Client.styles.css" rel="stylesheet" />
    <link href="manifest.json" rel="manifest" />
    <link rel="apple-touch-icon" sizes="512x512" href="icon-512.png" />

</head>

<body>

    <!-- Material CSS -->
    <link href="css/material.min.css" rel="stylesheet">

    <link href="https://fonts.googleapis.com/css?family=Roboto:300,400,500,700&display=swap" rel="stylesheet" />
    <link href="_content/MudBlazor/MudBlazor.min.css" rel="stylesheet" />

    <script>
        const CultureFieldName = 'culture';

        function getBrowserCulture() {
            return (navigator.languages && navigator.languages.length) ? navigator.languages[0] : 
                navigator.userLanguage || navigator.language || navigator.browserLanguage;
        }

        function getCulture() {
            return window.localStorage[CultureFieldName];
        }

        function setCulture(value) {
            window.localStorage[CultureFieldName] = value;
        }

        window.setLocalImage = async (imageElementId) => {
            document.getElementById(imageElementId).src = "icon-512.png";
        }

        window.setUrlImage = async (imageElementId) => {
            document.getElementById(imageElementId).src = "https://avatars.githubusercontent.com/u/9141961";
        }

        window.setStreamImage = async (imageElementId, imageStream) => {
            const arrayBuffer = await imageStream.arrayBuffer();
            const blob = new Blob([arrayBuffer]);
            const url = URL.createObjectURL(blob);
            document.getElementById(imageElementId).src = url;
            // image not visible when url is directly revoked
            //URL.revokeObjectURL(url);
            return url;
        }

        window.resetCaptureImage = async (imageElementId, objectUrl) => {
            document.getElementById(imageElementId).src = "";
            if (!!objectUrl) {
                URL.revokeObjectURL(objectUrl);
            }
        }

    </script>

    <div id="app" style="height: 100%; background-color: lightgray"></div>

    <div id="blazor-error-ui">
        An unhandled error has occurred.
        <a href="" class="reload">Reload</a>
        <a class="dismiss">🗙</a>
    </div>
    <script src="_framework/blazor.webassembly.js"></script>
    <script>navigator.serviceWorker.register('service-worker.js');</script>
    <script src="_content/MudBlazor/MudBlazor.min.js"></script>
</body>

</html>
